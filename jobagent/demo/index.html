<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Agent — Demo</title>
  <meta name="description" content="Job Agent demo landing page." />
  <style>
    :root{
      --bg:#0b0f17;
      --card:#0f1522;
      --text:#e9eef7;
      --muted:#a8b3c7;
      --line:rgba(255,255,255,0.10);
      --accent:#f0c77a;
      --accent2:#e7b55f;
      --shadow: 0 18px 60px rgba(0,0,0,0.45);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(240,199,122,0.22), transparent 60%),
        radial-gradient(900px 450px at 10% 10%, rgba(99,102,241,0.18), transparent 60%),
        var(--bg);
    }
    .wrap{max-width:980px;margin:0 auto;padding:28px 18px 70px}
    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(15,21,34,0.66);
      backdrop-filter: blur(10px);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .thumb {
        width: 100%;
        aspect-ratio: 16 / 9;        /* 핵심 */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border-bottom: 1px solid var(--line);
      }
      
    .body{padding:18px}
    .kicker{
      font-size:12px;
      letter-spacing:1.2px;
      text-transform:uppercase;
      color:rgba(233,238,247,0.75);
      font-weight:800;
    }
    h1{margin:10px 0 10px;font-size:34px;line-height:1.1;letter-spacing:-0.5px}
    .desc{margin:0;color:var(--muted);font-size:15px;line-height:1.55}
    .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .badge{
      border:1px dashed rgba(240,199,122,0.40);
      background: rgba(240,199,122,0.06);
      padding:7px 10px;
      border-radius:999px;
      font-weight:800;
      font-size:12px;
      color:rgba(233,238,247,0.92);
    }
    .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      text-decoration:none;
      font-weight:900;
      font-size:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,0.02);
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
      color:var(--text);
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(0,0,0,0.25)}
    .btn.primary{
      border:none;
      color:#1a1a1a;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .video-wrap{margin-top:18px}
    .video-card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(15,21,34,0.55);
      backdrop-filter: blur(10px);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .video-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px;border-bottom:1px solid var(--line);
    }
    .video-head .title{font-weight:950;letter-spacing:-0.2px}
    .video-head .hint{color:var(--muted);font-size:12px;font-weight:700}
    .iframe{
      width:100%;
      aspect-ratio: 16 / 9;
      border:0;
      display:block;
      background:#000;
    }
    .foot{margin-top:16px;color:var(--muted);font-size:12px;text-align:center}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;}
    .project-img-job-agent {
        background-image: url("../../images/project_job_agent.png");
      }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Minimal landing card -->
    <section class="card" aria-label="Job Agent demo landing">
      <div class="thumb project-img-job-agent" role="img" aria-label="Abstract automation cover"></div>
      <div class="body">
        <div class="kicker">Applied Automation · Job Search</div>
        <h1>Job Agent</h1>
        <p class="desc">
          Minimal demo landing for the job application agent.
          Assisted apply across Naukri + LinkedIn with ATS keyword scoring and tracking.
        </p>

        <div class="badges" aria-label="Tags">
          <span class="badge">Automation</span>
          <span class="badge">LLM</span>
          <span class="badge">LangChain</span>
          <span class="badge">ATS</span>
          <span class="badge">Tracking</span>
        </div>

        <div class="btns">
          <!-- 필요 없으면 삭제 가능 -->
          <a class="btn primary" href="#demo">🎥 Watch Demo</a>
        </div>
      </div>
    </section>

    <!-- Video -->
    <div class="video-wrap" id="demo">
      <section class="video-card" aria-label="Demo video">
        <div class="video-head">
          <div class="title">Demo Video</div>
          <div class="hint">Replace <span class="mono">VIDEO_URL</span> in the HTML</div>
        </div>

        <!-- Option A) YouTube/Vimeo embed -->
        <!-- <iframe
          class="iframe"
          src="VIDEO_URL"
          title="India Job Agent Demo"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe> -->

        <!-- Option B) Self-hosted mp4 (use instead of iframe) -->
        <video class="iframe" controls playsinline preload="metadata">
          <source src="../../videos/demo.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
       
      </section>
    </div>

    <div class="foot">
      © <span id="y"></span> <span class="mono">junho.uk</span>
    </div>

  </div>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
